// ─── MINI-KERNEL ───────────────────────────────────────────
const KERNEL = {
    trennung(wert, etage) {
        return {
            geteilt: wert / etage,
            mod: wert % etage,
            quotient: Math.floor(wert / etage),
            rest: wert - (Math.floor(wert / etage) * etage)
        };
    },
    run(wert, etage) {
        const t = this.trennung(wert, etage);
        return {
            input: wert,
            etage,
            ...t,
            status: "RUN",
            timestamp: new Date().toISOString()
        };
    }
};
